# 1. Sync the tmux server's PATH with the current shell environment
run-shell 'tmux set-environment -g PATH "$PATH"'

# 2. Ensure environment variables are updated on session creation
set -g update-environment "PATH TERM"
source-file ~/.config/tmux/tmux.reset.conf

# Terminal Color and Italics Fixes
# Set the default terminal inside tmux
set -g default-terminal "tmux-256color"

# UNIVERSAL FIX: Support RGB (TrueColor) for ANY terminal (wezterm, ghostty, etc.)
set -as terminal-features ",*:RGB"

# UNIVERSAL FIX: Support Italics for ANY terminal
set -as terminal-features ",*:italic"

set -g status-position top

set -g @fzf-url-fzf-options '-p 60%,30% --prompt="    " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# ==========================================
# Plugins
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# ==========================================
# Minimalist Native Status Bar (VS Code Dark+)
# ==========================================

# Base status bar colors
set -g status-bg "#1e1e1e"
set -g status-fg "#cccccc"

# Pane border styling
set -g pane-active-border-style 'fg=#007acc,bg=default'
set -g pane-border-style 'fg=#37373d,bg=default'

# Status left (empty for minimal look)
set -g status-left ""

# Status right (Prefix Indicator + Application + Session)
set -g status-right-length 120
set -g status-right "#{?client_prefix,#[fg=#1e1e1e,bg=#007acc,bold] ⌨ PREFIX ,}#[fg=#858585,bg=#1e1e1e] #{pane_current_command} #[fg=#37373d,bg=#1e1e1e]█#[fg=#1e1e1e,bg=#007acc,bold] #S "

# Window styling
set -g window-status-separator " "

# Inactive window: Grey number block, Dark grey text block
set -g window-status-format "#[fg=#cccccc,bg=#37373d] #I #[fg=#858585,bg=#252526] #W "

# Active window: Blue number block, Dark grey text block
set -g window-status-current-format "#[fg=#1e1e1e,bg=#007acc,bold] #I #[fg=#cccccc,bg=#252526,nobold] #W "

# Style the actual terminal background
# Inactive pane: slightly darker/dimmer
set -g window-style 'bg=#252526'
# Active pane: VS Code Dark+ default background
set -g window-active-style 'bg=#1e1e1e'


# Update borders to match your VS Code theme
set -g pane-active-border-style 'bg=#252526'
set -g pane-border-style 'bg=#1e1e1e'



# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.config/tmux/plugins/tpm/tpm'
