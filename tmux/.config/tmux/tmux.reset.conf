# -----------------------------------------------------------------------------
# General Settings & Fixes
# -----------------------------------------------------------------------------
set -g base-index 1           # Start windows at 1, not 0
setw -g pane-base-index 1     # Start panes at 1, not 0
set -g renumber-windows on    # Automatically renumber windows when one is closed
set -g detach-on-destroy off  # Don't exit tmux when closing a session
set -g focus-events on
set -sg escape-time 0
set -g history-limit 1000000
set -g set-clipboard on
set -g mouse on
setw -g mode-keys vi
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{b:pane_current_path}'
set-window-option -g xterm-keys on

# Prefix configuration
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -----------------------------------------------------------------------------
# Config Management
# -----------------------------------------------------------------------------
# Reload config
bind R source-file ~/.config/tmux/tmux.conf  

# -----------------------------------------------------------------------------
# Window Management
# -----------------------------------------------------------------------------
bind c new-window -c "#{pane_current_path}"
bind r command-prompt "rename-window %%"
bind w kill-window

# Move between windows (Alt/Meta bindings)
bind -n M-h previous-window
bind -n M-l next-window

# Quick Window Switching (Alt + 1-9)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# -----------------------------------------------------------------------------
# Pane Management
# -----------------------------------------------------------------------------
# Better Split Keys
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# Pane Control & Utility
bind q kill-pane
bind x swap-pane -D          # Swap pane
bind * setw synchronize-panes
bind P set pane-border-status
bind K send-keys "clear"\; send-keys "Enter"

# Zoom
bind -n M-z resize-pane -Z

# Resizing panes (Repeatable)
bind -r , resize-pane -L 10
bind -r . resize-pane -R 10
bind -r - resize-pane -D 5
bind -r = resize-pane -U 5

# -----------------------------------------------------------------------------
# Session Management
# -----------------------------------------------------------------------------
bind S choose-session

# Move between sessions (Alt/Meta bindings)
bind -n M-j switch-client -n
bind -n M-k switch-client -p

# M-S (Shift+Alt+S) for fuzzy window switching
bind-key -n M-S run-shell "tmux choose-tree -Zwf '##{==:##{session_name},#{session_name}}'"

# Choose Session (Replaces Sesh)
bind-key -n "M-s" choose-session

# Choose Tree / Project (Replaces Sesh Projectile)
bind-key -n "M-p" choose-tree -Z


# -----------------------------------------------------------------------------
# Copy Mode
# -----------------------------------------------------------------------------
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Trying to unbind * in copy/terminal mode
unbind -T copy-mode-vi '*'

